# Copy this file to "config.properties" and fill in your own values.
# config.properties is listed in .gitignore, so your password never goes into Git.
# Environment variables DB_URL, DB_USER, DB_PASSWORD and PORT override these values.

db.url=jdbc:postgresql://localhost:5432/readytime
db.user=postgres
db.password=CHANGE_ME
port=8080
# Which website may call the API ("*" = any). Example: http://localhost:5500
cors.origin=*
