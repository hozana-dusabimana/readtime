# ReadyTime settings.
# Your own values go in backend/config.properties (not in Git, see config.example.properties).
# Environment variables win over that file: DB_URL, DB_USER, DB_PASSWORD, PORT, CORS_ORIGIN, SEED_DEMO.
spring.application.name=readytime
spring.config.import=optional:file:./config.properties

server.port=${PORT:${port:8080}}

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:${db.url:jdbc:postgresql://localhost:5432/readytime}}
spring.datasource.username=${DB_USER:${db.user:postgres}}
spring.datasource.password=${DB_PASSWORD:${db.password:}}

# Run schema.sql on every start (it only creates what is missing).
# The file contains a DO $$ ... $$ block, so it is sent to PostgreSQL as ONE script
# instead of being split at every ";".
spring.sql.init.mode=always
spring.sql.init.separator=^^^ END OF SCRIPT ^^^

# ---- JSON ----
# Leave out fields that are null (e.g. businessId of a client).
spring.jackson.default-property-inclusion=non_null

# ---- API only: no static files, unknown addresses give a JSON 404 ----
spring.web.resources.add-mappings=false

# ---- ReadyTime ----
# Which website may call the API ("*" = any). Example: http://localhost:5500
readytime.cors-origin=${CORS_ORIGIN:${cors.origin:*}}
# Create demo accounts (admin, provider, client) on start
readytime.seed-demo=${SEED_DEMO:${seed.demo:true}}
